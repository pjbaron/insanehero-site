<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Zombaby Bouncer</title>
<!-- Poki SDK (loads from CDN; if absent offline, js/poki.js degrades to no-ops). -->
<script src="https://game-cdn.poki.com/scripts/v2/poki-sdk.js"></script>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: #111; overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;                 /* no scroll/zoom on touch */
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #c { display: block; touch-action: none; background: #8CB5FF; }
</style>
</head>
<body>
  <canvas id="c"></canvas>
  <!-- Dev-only build-path flag. The release/testing builds replace this line with
       the appropriate compile-time literal (window.DEV_TOOLS = false / true). -->
  <script>window.DEV_TOOLS = true;</script>
  <script src="js/planck.min.js"></script>
  <script src="js/game.min.js"></script>
</body>
</html>
