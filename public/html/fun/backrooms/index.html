<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LEVEL 0 - Backrooms</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
  }
  #crosshair {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 12px;
    height: 12px;
    pointer-events: none;
  }
  #crosshair .ch-h {
    position: absolute;
    top: 50%;
    left: 0;
    width: 100%;
    height: 1px;
    background: rgba(255,255,255,0.4);
    transform: translateY(-50%);
  }
  #crosshair .ch-v {
    position: absolute;
    top: 0;
    left: 50%;
    width: 1px;
    height: 100%;
    background: rgba(255,255,255,0.4);
    transform: translateX(-50%);
  }
  #seed-display {
    position: fixed;
    top: 8px;
    right: 12px;
    font-family: monospace;
    font-size: 12px;
    color: rgba(255,255,255,0.6);
    pointer-events: none;
  }
</style>
</head>
<body>

<div id="crosshair">
  <div class="ch-h"></div>
  <div class="ch-v"></div>
</div>
<div id="seed-display">SEED --</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
<script type="module" src="src/main.js"></script>

</body>
</html>
